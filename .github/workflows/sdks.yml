# Generates the Python and TypeScript SDKs for the Trustee platform API with APIMatic.
#
# The SDKs are uploaded as workflow artifacts. They are not committed: generated code is an output of
# `openapi/trustee-v1.json`, which is the single source of truth. See docs/SDKS.md.
#
# Setup: add the repository secret APIMATIC_API_KEY (Settings -> Secrets and variables -> Actions).
# Until it is set, this job prints a notice and exits 0.
#
# The APIMatic CLI needs Node 24 or newer. Its version is pinned so a new release cannot change the output
# between runs.

name: sdks

on:
  workflow_dispatch:
  push:
    paths:
      - "openapi/**"
      - "apimatic/**"
      - "scripts/export_openapi.py"
      - ".github/workflows/sdks.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APIMATIC_CLI_VERSION: "2.0.0"
      SPEC_SOURCE: openapi/trustee-v1.json
      SPEC_TARGET: apimatic/src/spec/trustee-v1.json
    steps:
      - name: Check for the APIMatic key
        id: key
        env:
          APIMATIC_API_KEY: ${{ secrets.APIMATIC_API_KEY }}
        run: |
          # The runner context is not available in job-level env, so SDK_ROOT is set here.
          echo "SDK_ROOT=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
          if [ -z "$APIMATIC_API_KEY" ]; then
            echo "::notice title=APIMatic SDKs skipped::Set the APIMATIC_API_KEY secret to generate SDKs. See docs/SDKS.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 24
        if: steps.key.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the APIMatic CLI
        if: steps.key.outputs.ready == 'true'
        run: npm install -g "@apimatic/cli@${APIMATIC_CLI_VERSION}"

      - name: Stage the spec where the CLI reads it
        if: steps.key.outputs.ready == 'true'
        run: |
          mkdir -p "$(dirname "$SPEC_TARGET")"
          cp "$SPEC_SOURCE" "$SPEC_TARGET"

      - name: Validate the spec with APIMatic
        if: steps.key.outputs.ready == 'true'
        env:
          APIMATIC_API_KEY: ${{ secrets.APIMATIC_API_KEY }}
        run: apimatic api validate --file "$SPEC_SOURCE" --auth-key "$APIMATIC_API_KEY"

      - name: Generate the Python SDK
        if: steps.key.outputs.ready == 'true'
        env:
          APIMATIC_API_KEY: ${{ secrets.APIMATIC_API_KEY }}
        run: |
          apimatic sdk generate --language=python --input=apimatic \
            --destination="$SDK_ROOT/python" --force --auth-key "$APIMATIC_API_KEY"

      - name: Generate the TypeScript SDK
        if: steps.key.outputs.ready == 'true'
        env:
          APIMATIC_API_KEY: ${{ secrets.APIMATIC_API_KEY }}
        run: |
          apimatic sdk generate --language=typescript --input=apimatic \
            --destination="$SDK_ROOT/typescript" --force --auth-key "$APIMATIC_API_KEY"

      - name: Upload the Python SDK
        if: steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trustee-sdk-python
          path: ${{ env.SDK_ROOT }}/python
          if-no-files-found: error
          retention-days: 30

      - name: Upload the TypeScript SDK
        if: steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trustee-sdk-typescript
          path: ${{ env.SDK_ROOT }}/typescript
          if-no-files-found: error
          retention-days: 30
