spec: blueprint/v1
name: trustee-northwind

agent:
  build:
    context: ../../..
    dockerfile: deploy/astropods/Dockerfile
    args:
      AGENT: northwind
  interfaces:
    frontend: true # serves its own A2A surface (Agent Card and /a2a) on port 80
    messaging: false
  healthcheck:
    path: /healthz
  inputs:
    - name: AGENT_PUBLIC_URL
      datatype: string
      description: Public https URL of this agent once deployed. It goes into the Agent Card and is how peers reach it.
    - name: TRUSTEE_URL
      datatype: string
      description: Public base URL of Trustee, for example https://trustee-arena.onrender.com
    - name: TRUSTEE_OPERATOR_TOKEN
      datatype: string
      secret: true
      optional: true
      description: Trustee's operator token, if Trustee has one set
    - name: AGENT_IDENTITY_SECRET
      datatype: string
      secret: true
      description: Stable identity secret from scripts/gen_agent_secret.py (a separate one per agent)
    - name: TRUSTEE_MODE
      datatype: string
      default: auto
      optional: true
      display-as: select
      options: [auto, live, scripted]
      description: auto uses the AI Gateway model, else the recorded negotiation
    - name: PAYPAL_BUYER_EMAIL
      datatype: string
      optional: true
      description: PayPal sandbox account email Northwind is registered with at Trustee
    - name: TIDEWATER_URL
      datatype: string
      description: Public base URL of the hosted Tidewater agent. It is the only seller Northwind may buy from.
    - name: NORTHWIND_TRIGGER_SECRET
      datatype: string
      secret: true
      optional: true
      description: Shared secret that lets the Trustee arena ask Northwind to buy. Empty disables the trigger.

models:
  default:
    provider: gateway
    models: [claude-sonnet-4-6, claude-haiku-4-5]
